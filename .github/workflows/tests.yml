name: Source tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -c 'import yaml' || (sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml)
      - run: python3 scripts/prepare-test-sources.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
